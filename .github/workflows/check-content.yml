name: Check historical content
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the schema and parser
        run: node --test tests/content.test.mjs
      - name: Validate and export Markdown
        run: node scripts/build.mjs
      - name: Check that generated data matches Markdown
        run: git diff --exit-code -- dist/data.js dist/knowledge.json
